<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <style>
      @keyframes flow-line {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .flow {
        stroke-dasharray: 6 4;
        animation: flow-line 1.8s linear infinite;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono-text {
        font-family: 'JetBrains Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="380" rx="16" fill="#090b10"/>
  <rect width="920" height="380" rx="16" fill="url(#archGlow)"/>
  <rect width="920" height="380" rx="16" fill="none" stroke="#16202e" stroke-width="1.2"/>

  <!-- Left: Cloud Telegram -->
  <g transform="translate(32, 40)">
    <rect width="210" height="300" rx="12" fill="#0c121d" stroke="#1e2e45" stroke-width="1.2"/>
    <rect width="210" height="36" rx="12" fill="#131c2d"/>
    <text class="node-text" x="16" y="23" fill="#38bdf8" font-size="12" font-weight="700">TELEGRAM CLOUD</text>
    
    <g transform="translate(16, 56)">
      <rect width="178" height="64" rx="8" fill="#111a2a" stroke="#21334f" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">Telegram Bot API</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">HTTPS Port 443</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="178" height="64" rx="8" fill="#111a2a" stroke="#21334f" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">End-User Clients</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">iOS / Android / Desktop</text>
    </g>

    <g transform="translate(16, 216)">
      <rect width="178" height="64" rx="8" fill="#111a2a" stroke="#21334f" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">Direct /apk Delivery</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">In-Chat Signed APK</text>
    </g>
  </g>

  <!-- Flow 1: Telegram <-> Android Host -->
  <path class="flow" d="M 242 120 L 302 120" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path class="flow" d="M 302 140 L 242 140" fill="none" stroke="#34d399" stroke-width="2"/>
  <text class="mono-text" x="250" y="108" fill="#38bdf8" font-size="9">getUpdates</text>
  <text class="mono-text" x="248" y="156" fill="#34d399" font-size="9">sendMessage</text>

  <!-- Center: Android On-Device ART Daemon -->
  <g transform="translate(302, 30)">
    <rect width="320" height="320" rx="14" fill="#0a1219" stroke="#16382b" stroke-width="1.4"/>
    <rect width="320" height="38" rx="14" fill="#10251c"/>
    <circle cx="20" cy="19" r="4.5" fill="#10b981"/>
    <text class="node-text" x="32" y="24" fill="#6ee7b7" font-size="12.5" font-weight="700">ANDROID HOST (ART COROUTINE DAEMON)</text>
    
    <!-- Sub-node 1: Coroutine Engine -->
    <g transform="translate(16, 52)">
      <rect width="288" height="52" rx="8" fill="#0d1f18" stroke="#1c4735" stroke-width="1"/>
      <text class="node-text" x="12" y="22" fill="#a7f3d0" font-size="11.5" font-weight="700">Kotlin 2.0 Coroutine Runtime</text>
      <text class="mono-text" x="12" y="38" fill="#94a3b8" font-size="10">8-12MB RAM • Negligible Idle CPU • API 29-35</text>
    </g>

    <!-- Sub-node 2: Hardware Keystore -->
    <g transform="translate(16, 114)">
      <rect width="288" height="52" rx="8" fill="#0d1f18" stroke="#1c4735" stroke-width="1"/>
      <text class="node-text" x="12" y="22" fill="#a7f3d0" font-size="11.5" font-weight="700">Android Keystore (StrongBox / TEE)</text>
      <text class="mono-text" x="12" y="38" fill="#94a3b8" font-size="10">AES-256-GCM Master Keys • Zero Token Leak</text>
    </g>

    <!-- Sub-node 3: Device Actions & Telemetry -->
    <g transform="translate(16, 176)">
      <rect width="288" height="52" rx="8" fill="#0d1f18" stroke="#1c4735" stroke-width="1"/>
      <text class="node-text" x="12" y="22" fill="#a7f3d0" font-size="11.5" font-weight="700">Device Action Controller &amp; Watchdog</text>
      <text class="mono-text" x="12" y="38" fill="#94a3b8" font-size="10">Flashlight • Vibration • Battery • Thermal Alerts</text>
    </g>

    <!-- Sub-node 4: Bot Packages -->
    <g transform="translate(16, 238)">
      <rect width="288" height="66" rx="8" fill="#0d1f18" stroke="#1c4735" stroke-width="1"/>
      <text class="node-text" x="12" y="22" fill="#a7f3d0" font-size="11.5" font-weight="700">Atomic .botpkg Runner &amp; Rollback</text>
      <text class="mono-text" x="12" y="38" fill="#94a3b8" font-size="10">Commander • Exon • Music • AI • PingPong</text>
      <text class="mono-text" x="12" y="52" fill="#6ee7b7" font-size="9.5">SHA-256 Verified • Auto-Fallbacks</text>
    </g>
  </g>

  <!-- Flow 2: Android Host <-> Cloudflare Store -->
  <path class="flow" d="M 622 170 L 678 170" fill="none" stroke="#f97316" stroke-width="2"/>
  <path class="flow" d="M 678 190 L 622 190" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text class="mono-text" x="626" y="158" fill="#f97316" font-size="9">Get Packages</text>
  <text class="mono-text" x="628" y="206" fill="#38bdf8" font-size="9">Sync Catalog</text>

  <!-- Right: Cloudflare Edge Backend -->
  <g transform="translate(678, 40)">
    <rect width="210" height="300" rx="12" fill="#13101a" stroke="#382645" stroke-width="1.2"/>
    <rect width="210" height="36" rx="12" fill="#20172e"/>
    <text class="node-text" x="16" y="23" fill="#f97316" font-size="12" font-weight="700">CLOUDFLARE EDGE</text>
    
    <g transform="translate(16, 56)">
      <rect width="178" height="64" rx="8" fill="#1a1426" stroke="#442a5c" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">Cloudflare Workers</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">Serverless REST API</text>
    </g>

    <g transform="translate(16, 136)">
      <rect width="178" height="64" rx="8" fill="#1a1426" stroke="#442a5c" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">Cloudflare D1 &amp; R2</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">SQLite &amp; .botpkg Blobs</text>
    </g>

    <g transform="translate(16, 216)">
      <rect width="178" height="64" rx="8" fill="#1a1426" stroke="#442a5c" stroke-width="1"/>
      <text class="node-text" x="14" y="24" fill="#ffffff" font-size="12" font-weight="600">Web Admin HUD</text>
      <text class="mono-text" x="14" y="44" fill="#94a3b8" font-size="10">Dark Ops Dashboard</text>
    </g>
  </g>
</svg>
