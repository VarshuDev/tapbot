<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes spin-orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .orbit-group { animation: spin-orbit 2.8s linear infinite; transform-origin: 12px 12px; }
    </style>
  </defs>
  <circle cx="12" cy="12" r="8" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <g class="orbit-group">
    <circle cx="12" cy="4" r="2.5" fill="#10b981"/>
    <circle cx="12" cy="20" r="2.5" fill="#06b6d4"/>
    <path d="M 4 12 A 8 8 0 0 1 12 4" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 20 12 A 8 8 0 0 1 12 20" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>