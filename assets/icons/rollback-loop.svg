<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes cycle-rewind {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      .rewind { animation: cycle-rewind 3s linear infinite; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="rewind">
    <path d="M 4 12 A 8 8 0 1 1 8 18.9" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
    <polyline points="4 7 4 12 9 12" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>