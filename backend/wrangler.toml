name = "tapbot-catalog-backend"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tapbot_catalog"
database_id = "224755cd-4178-4395-b8b7-255049197ca5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tapbot-packages"
preview_bucket_name = "tapbot-packages-preview"

[vars]
# ADMIN_API_KEY must be provisioned via `wrangler secret put ADMIN_API_KEY` (or local `.dev.vars`)
ENVIRONMENT = "development"
